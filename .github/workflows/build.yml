name: build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: boneappetit-native-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: powershell

jobs:
  build:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) ||
        (github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]')))
    runs-on: [self-hosted, Windows, X64, awl-ci, awl-ci-windows, awl-eu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select existing native .NET 10 SDK
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath 'global.json') { throw 'An existing global.json must be reconciled before SDK selection.' }
          $available = @(dotnet --list-sdks)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $versions = @($available | ForEach-Object {
            if ($_ -match '^(10\.0\.[0-9]+)\s+\[') { [version]$Matches[1] }
          } | Sort-Object -Descending)
          if ($versions.Count -eq 0) { throw 'The existing native runner requires a stable .NET 10.0 SDK.' }
          $selected = $versions[0].ToString()
          $configuration = @{sdk=@{version=$selected; rollForward='disable'; allowPrerelease=$false}} | ConvertTo-Json -Depth 3
          [System.IO.File]::WriteAllText((Join-Path $PWD 'global.json'), $configuration, [System.Text.UTF8Encoding]::new($false))
          $actual = (dotnet --version).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actual -ne $selected) { throw 'The selected SDK was not used.' }
          Write-Output ('Using existing native .NET SDK ' + $actual)

      - name: Prepare fresh native game references
        env:
          AWL_VALHEIM_MANAGED_DIR: ${{ vars.AWL_VALHEIM_MANAGED_DIR }}
          AWL_BEPINEX_CORE_DIR: ${{ vars.AWL_BEPINEX_CORE_DIR }}
          AWL_JOTUNN_DIR: ${{ vars.AWL_JOTUNN_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          $game = $env:AWL_VALHEIM_MANAGED_DIR
          $bep = $env:AWL_BEPINEX_CORE_DIR
          $jotunn = $env:AWL_JOTUNN_DIR
          if ([string]::IsNullOrWhiteSpace($game)) { $game = $env:VALHEIM_MANAGED_DIR }
          if ([string]::IsNullOrWhiteSpace($bep)) { $bep = $env:BEPINEX_CORE_DIR }
          if ([string]::IsNullOrWhiteSpace($jotunn)) { $jotunn = $env:JOTUNN_DIR }
          if (-not $game -or -not $bep -or -not $jotunn) { throw 'Configure the native AWL game, BepInEx and Jotunn reference directories.' }
          $root = Join-Path $env:RUNNER_TEMP ('boneappetit-native-' + [guid]::NewGuid().ToString('N'))
          $toolRoot = Join-Path $root 'tools'
          New-Item -ItemType Directory -Path $root | Out-Null
          $nugetConfig = Join-Path $root 'nuget-publicizer.config'
          [IO.File]::WriteAllText($nugetConfig, '<configuration><packageSources><clear/><add key="nuget.org" value="https://api.nuget.org/v3/index.json"/></packageSources></configuration>')
          dotnet tool install BepInEx.AssemblyPublicizer.Cli --version 0.4.3 --tool-path $toolRoot --configfile $nugetConfig
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $publicizer = Join-Path $toolRoot 'assembly-publicizer.exe'
          $manifest = & .\tools\Prepare-NativeReferences.ps1 -GameManagedDir $game -BepInExCoreDir $bep -JotunnDir $jotunn -PublicizerPath $publicizer -OutputRoot (Join-Path $root 'references')
          Copy-Item -LiteralPath (Join-Path $manifest.PublicizedRoot 'reference-manifest.json') -Destination 'native-reference-manifest.json'
          foreach ($entry in @(('BEPINEX_CORE_DIR=' + $bep), ('JOTUNN_DIR=' + $jotunn), ('VALHEIM_MANAGED_DIR=' + $game), ('AWL_NATIVE_VALHEIM_REFERENCES=' + $manifest.PublicizedRoot))) {
            $entry | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Build against the prepared native references
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $PWD 'tools\NativeReferences.targets'
          dotnet build .\BoneAppetit.csproj -c Release --nologo ('-p:CustomAfterMicrosoftCommonTargets=' + $target) ('-p:AwlNativeValheimReferences=' + $env:AWL_NATIVE_VALHEIM_REFERENCES)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dll = Join-Path $PWD 'bin\Release\net472\BoneAppetit.dll'
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo($dll).FileVersion
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') { throw 'Built DLL has no valid version.' }
          ('BONEAPPETIT_VERSION=' + $version) | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/upload-artifact@v4
        with:
          name: BoneAppetit-${{ env.BONEAPPETIT_VERSION }}-native-windows
          path: |
            bin/Release/net472/BoneAppetit.dll
            native-reference-manifest.json
