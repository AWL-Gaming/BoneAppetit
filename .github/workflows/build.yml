name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Valheim dedicated server references
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $steam = Join-Path $env:RUNNER_TEMP 'steamcmd'
          $game = Join-Path $env:RUNNER_TEMP 'valheim-server'
          New-Item -ItemType Directory -Path $steam,$game -Force | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'steamcmd.zip'
          Invoke-WebRequest 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile $zip
          Expand-Archive $zip $steam -Force
          $steamExe = Join-Path $steam 'steamcmd.exe'
          # First launch lets a freshly downloaded SteamCMD finish its own update before app_update.
          & $steamExe +quit
          if (-not (Test-Path $steamExe)) { throw 'SteamCMD bootstrap failed' }
          & $steamExe +force_install_dir $game +login anonymous +app_update 896660 validate +quit
          if ($LASTEXITCODE -ne 0) { throw "steamcmd app_update exited $LASTEXITCODE" }
          "VALHEIM_MANAGED_DIR=$(Join-Path $game 'valheim_server_Data\Managed')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install BepInEx and Jotunn references
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bepRoot = Join-Path $env:RUNNER_TEMP 'bepinex'
          $bepZip = Join-Path $env:RUNNER_TEMP 'bepinex.zip'
          Invoke-WebRequest 'https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/5.4.2350/' -OutFile $bepZip
          Expand-Archive $bepZip $bepRoot -Force
          $bep = Get-ChildItem $bepRoot -Recurse -File -Filter BepInEx.dll | Select-Object -First 1
          if (-not $bep) { throw 'BepInEx.dll not found in downloaded package' }
          "BEPINEX_CORE_DIR=$($bep.Directory.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          $jotunnRoot = Join-Path $env:RUNNER_TEMP 'jotunn'
          $jotunnZip = Join-Path $env:RUNNER_TEMP 'jotunn.zip'
          Invoke-WebRequest 'https://thunderstore.io/package/download/ValheimModding/Jotunn/2.30.0/' -OutFile $jotunnZip
          Expand-Archive $jotunnZip $jotunnRoot -Force
          $jotunn = Get-ChildItem $jotunnRoot -Recurse -File -Filter Jotunn.dll | Select-Object -First 1
          if (-not $jotunn) { throw 'Jotunn.dll not found in downloaded package' }
          "JOTUNN_DIR=$($jotunn.Directory.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build
        shell: pwsh
        run: dotnet build .\BoneAppetit.csproj -c Release --nologo

      - uses: actions/upload-artifact@v4
        with:
          name: BoneAppetit-3.3.2
          path: bin/Release/net472/BoneAppetit.dll
